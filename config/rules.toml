# Wording hints for a suggested GST code. These are suggestions, not rulings.
# The report always says to check them.

[[code_suggestions]]
id = "bank"
suggest = "BAS Excluded"
note = "Suggestion, check it. Bank fees are usually input taxed, so the code is GST-free or BAS Excluded, not GST on Expenses."
phrases = ["bank fee", "bank charge", "account keeping", "account fee"]

[[code_suggestions]]
id = "interest"
suggest = "BAS Excluded"
note = "Suggestion, check it. Interest is a financial supply and is usually GST-free or BAS Excluded."
phrases = ["interest received", "interest income", "interest charged"]

[[code_suggestions]]
id = "stamp_duty"
suggest = "BAS Excluded"
note = "Suggestion, check it. Stamp duty is usually GST-free or BAS Excluded."
phrases = ["stamp duty"]

[[code_suggestions]]
id = "govt_fee"
suggest = "BAS Excluded"
note = "Suggestion, check it. Government fees are usually GST-free or BAS Excluded."
phrases = ["government fee", "govt fee", "council rates"]

[[code_suggestions]]
id = "insurance"
suggest = "GST on Expenses"
note = "Suggestion, check it. Insurance usually includes GST. The stamp duty on the same invoice does not, so that portion stays out of 1B."
phrases = ["insurance premium", "insurance"]
